<!-- ========================================================================== -->
<!-- MANEKIN FASHION - 商品カタログ (一覧・新作・詳細・お気に入り) (catalog.html) a-->
<!-- ========================================================================== -->

<section class="page-view" id="view-items">
    <div class="container page-container">
        <!-- ページタイトルとパンくずナビ -->
        <div class="page-breadcrumb" id="catalog-breadcrumb">
            <a href="#home">HOME</a> &gt; <span id="catalog-breadcrumb-current">COLLECTION</span>
        </div>
        <div class="page-header">
            <h1 class="page-title" id="catalog-page-title">COLLECTION</h1>
            <p class="page-subtitle" id="catalog-page-subtitle">厳選されたモダンアイテム一覧</p>
        </div>

        <!-- フィルターとソートバーのコントロールエリア -->
        <div class="catalog-controls">
            <!-- カテゴリフィルターボタングループ -->
            <div class="filter-group" id="category-filter-group">
                <button class="filter-btn active" data-category="ALL">ALL (すべて)</button>
                <button class="filter-btn" data-category="TOPS">TOPS (トップス)</button>
                <button class="filter-btn" data-category="BOTTOMS">BOTTOMS (ボトムス)</button>
                <button class="filter-btn" data-category="OUTER">OUTER (アウター)</button>
            </div>

            <!-- 並び替えセレクトボックス -->
            <div class="sort-group">
                <label for="sort-select" class="sort-label">並び替え:</label>
                <select id="sort-select" class="sort-select">
                    <option value="default">おすすめ順</option>
                    <option value="price-asc">価格の安い順</option>
                    <option value="price-desc">価格の高い順</option>
                    <option value="name-asc">商品名順</option>
                </select>
            </div>
        </div>

        <!-- 商品一覧グリッド表示エリア（JSで動的挿入） -->
        <div class="product-grid" id="catalog-product-grid">
            <!-- 商品カードがJSで生成されます -->
        </div>
    </div>
</section>

<!-- ============================================== -->
<!-- 3. 新着商品ページビュー (NEW ITEM)              -->
<!-- ============================================== -->
<section class="page-view" id="view-new-items">
    <div class="container page-container">
        <div class="page-breadcrumb">
            <a href="#home">HOME</a> &gt; <span>NEW ITEM</span>
        </div>
        <div class="page-header">
            <h1 class="page-title">NEW ARRIVALS</h1>
            <p class="page-subtitle">今期の新作コレクション</p>
        </div>

        <!-- 新着商品一覧グリッド -->
        <div class="product-grid" id="new-items-grid">
            <!-- 新着商品カードがJSで生成されます -->
        </div>
    </div>
</section>

<!-- ============================================== -->
<!-- 4. 商品詳細ページビュー (ITEM DETAIL)           -->
<!-- ============================================== -->
<section class="page-view" id="view-item-detail">
    <div class="container page-container">
        <!-- パンくずナビゲーション -->
        <div class="page-breadcrumb">
            <a href="#home">HOME</a> &gt; <a href="#items">ITEM</a> &gt; <span id="detail-breadcrumb-name">商品詳細</span>
        </div>

        <!-- 商品詳細の2カラムレイアウトコンテナ -->
        <div class="item-detail-layout" id="item-detail-layout">
            <!-- 詳細コンテンツはJavaScriptによって動的にレンダリングされます -->
        </div>
    </div>
</section>

<!-- ============================================== -->
<!-- 5. お気に入り一覧ページビュー (FAVORITE)         -->
<!-- ============================================== -->
<section class="page-view" id="view-favorites">
    <div class="container page-container">
        <div class="page-breadcrumb">
            <a href="#home">HOME</a> &gt; <span>FAVORITE</span>
        </div>
        <div class="page-header">
            <h1 class="page-title">FAVORITE ITEMS</h1>
            <p class="page-subtitle">お気に入りに保存したアイテム</p>
        </div>

        <!-- お気に入り商品グリッド -->
        <div class="product-grid" id="favorite-product-grid">
            <!-- お気に入りアイテムまたは空表示がJSで生成されます -->
        </div>
    </div>
</section>
